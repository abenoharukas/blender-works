<!doctype html>
<meta charset="utf-8" />
<title>export playground street</title>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
  import { buildStreet } from '../web/street.js';

  const log = (msg) =>
    fetch('/__log', { method: 'POST', body: String(msg) }).catch(() => {});

  // Chromium's Blob IPC storage fails on single Blobs > ~580 MB, causing GLTFExporter's
  // FileReader.readAsArrayBuffer(blob) to return null. Keep large octet-stream Blob parts in
  // JS typed-array memory and concatenate directly when readAsArrayBuffer() is called.
  const OrigBlob = window.Blob;
  const BIG_BLOB = 32 * 1024 * 1024;
  function partByteLength(p) {
    if (p instanceof ArrayBuffer) return p.byteLength;
    if (ArrayBuffer.isView(p)) return p.byteLength;
    return -1;
  }
  window.Blob = function (parts = [], opts = {}) {
    if (opts && opts.type === 'application/octet-stream' && Array.isArray(parts)) {
      let total = 0;
      let allBufs = true;
      for (const p of parts) {
        const len = partByteLength(p);
        if (len < 0) { allBufs = false; break; }
        total += len;
      }
      if (allBufs && total > BIG_BLOB) {
        return { size: total, type: opts.type, __parts: parts };
      }
    }
    return new OrigBlob(parts, opts);
  };
  window.Blob.prototype = OrigBlob.prototype;

  const origReadAsArrayBuffer = FileReader.prototype.readAsArrayBuffer;
  FileReader.prototype.readAsArrayBuffer = function (blob) {
    if (blob && blob.__parts) {
      const out = new Uint8Array(blob.size);
      let off = 0;
      for (const p of blob.__parts) {
        const view = p instanceof ArrayBuffer
          ? new Uint8Array(p)
          : new Uint8Array(p.buffer, p.byteOffset, p.byteLength);
        out.set(view, off);
        off += view.byteLength;
      }
      blob.__parts = null;
      queueMicrotask(() => {
        Object.defineProperty(this, 'result', { value: out.buffer, configurable: true });
        if (typeof this.onload === 'function') this.onload({ target: this });
        if (typeof this.onloadend === 'function') this.onloadend({ target: this });
      });
      return;
    }
    return origReadAsArrayBuffer.call(this, blob);
  };

  window.__exportDone = false;
  window.__exportError = null;
  try {
    const scene = new THREE.Scene();
    const street = buildStreet(scene, { carMode: 'gltfNodes' });

    // Strip runtime-only JS references (`mats` buckets & `lampSpots`) so GLTFExporter
    // does not serialize ~86 MB of unused JSON into `nodes[1].extras`.
    street.userData = {};

    // The offline scene is rendered with night emissives baked in: ThreeRT does
    // not run the web page's time-of-day boost, so carry the strengths over.
    const table = await (await fetch('./offline_emissive.json')).json();
    let applied = 0;
    const appliedMats = new Set();
    scene.traverse((object) => {
      const materials = Array.isArray(object.material) ? object.material : [object.material];
      for (const material of materials) {
        if (!material || appliedMats.has(material) || table[material.name] === undefined) continue;
        material.emissiveIntensity = table[material.name];
        material.needsUpdate = true;
        appliedMats.add(material);
        applied += 1;
      }
    });
    // Strip dummy all-zero UVs on untextured solid-color meshes so the binary GLB stays lean
    // (keep UV0 on any geometry whose material(s) include textures or window_* interior mapping).
    let strippedUvs = 0;
    const seenGeos = new Set();
    scene.traverse((object) => {
      if (!object.isMesh || !object.geometry?.attributes?.uv || seenGeos.has(object.geometry)) return;
      seenGeos.add(object.geometry);
      const mats = Array.isArray(object.material) ? object.material : [object.material];
      const keepUv = mats.some((m) => m && (
        Boolean(m.map || m.normalMap || m.roughnessMap || m.metalnessMap || m.emissiveMap || m.alphaMap)
        || (m.name && m.name.startsWith('window_'))
      ));
      if (!keepUv) {
        object.geometry.deleteAttribute('uv');
        strippedUvs += 1;
      }
    });
    await log(`built ${street.children.length} children, ${applied} emissive overrides, stripped ${strippedUvs} dummy UVs`);

    const glb = await new GLTFExporter().parseAsync(scene, { binary: true });
    await log(`glb ${glb.byteLength} bytes`);

    const bytes = new Uint8Array(glb);
    const CHUNK = 8 * 1024 * 1024;
    let ok = true;
    for (let off = 0, part = 0; off < bytes.byteLength; off += CHUNK, part += 1) {
      const end = Math.min(off + CHUNK, bytes.byteLength);
      const done = end >= bytes.byteLength ? 1 : 0;
      const slice = bytes.slice(off, end);
      const res = await fetch(`/__save_chunk?name=playground_street_rt.glb&part=${part}&done=${done}`, {
        method: 'POST',
        body: slice,
      });
      if (!res.ok) {
        ok = false;
        break;
      }
    }
    document.title = ok ? 'DONE' : 'SAVE-FAILED';
    await log(`save ${ok ? 200 : 500}`);
    window.__exportDone = true;
  } catch (error) {
    document.title = 'ERROR';
    window.__exportError = String(error && error.stack ? error.stack : error);
    await log(window.__exportError);
    window.__exportDone = true;
  }
</script>
