<!doctype html>
<meta charset="utf-8" />
<title>export playground street</title>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
  import { buildStreet } from '../web/street.js';

  const log = (msg) =>
    fetch('/__log', { method: 'POST', body: String(msg) }).catch(() => {});

  window.__exportDone = false;
  window.__exportError = null;
  try {
    const scene = new THREE.Scene();
    const street = buildStreet(scene);

    // The offline scene is rendered with night emissives baked in: ThreeRT does
    // not run the web page's time-of-day boost, so carry the strengths over.
    const table = await (await fetch('./offline_emissive.json')).json();
    let applied = 0;
    scene.traverse((object) => {
      const materials = Array.isArray(object.material) ? object.material : [object.material];
      for (const material of materials) {
        if (!material || table[material.name] === undefined) continue;
        material.emissiveIntensity = table[material.name];
        material.needsUpdate = true;
        applied += 1;
      }
    });
    // Strip dummy all-zero UVs on untextured solid-color meshes so the binary GLB stays well
    // under Chromium's 512 MiB FileReader/Blob cap (keep UV0 on all textured & window_* meshes!).
    let strippedUvs = 0;
    scene.traverse((object) => {
      if (!object.isMesh || !object.geometry?.attributes?.uv) return;
      const m = Array.isArray(object.material) ? object.material[0] : object.material;
      if (!m) return;
      const hasTex = Boolean(m.map || m.normalMap || m.roughnessMap || m.metalnessMap || m.emissiveMap || m.alphaMap);
      const keepUv = hasTex || (m.name && m.name.startsWith('window_'));
      if (!keepUv) {
        object.geometry.deleteAttribute('uv');
        strippedUvs += 1;
      }
    });
    await log(`built ${street.children.length} meshes, ${applied} emissive overrides, stripped ${strippedUvs} dummy UVs`);

    const glb = await new GLTFExporter().parseAsync(scene, { binary: true });
    await log(`glb ${glb.byteLength} bytes`);

    const saved = await fetch('/__save?name=playground_street_rt.glb', {
      method: 'POST',
      body: glb,
    });
    document.title = saved.ok ? 'DONE' : 'SAVE-FAILED';
    await log(`save ${saved.status}`);
    window.__exportDone = true;
  } catch (error) {
    document.title = 'ERROR';
    window.__exportError = String(error && error.stack ? error.stack : error);
    await log(window.__exportError);
    window.__exportDone = true;
  }
</script>
